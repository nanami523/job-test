<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就服乙級・葵花寶典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8F1;
    --paper-line:#E7E1D2;
    --ink:#26302B;
    --ink-soft:#5B6459;
    --yellow:#FFCE45;
    --pink:#FF8FA3;
    --mint:#4FBE8E;
    --sky:#4FA6D8;
    --purple:#9B7FE0;
    --coral:#FF7A5C;
    --olive:#8C9A4E;
    --card:#ffffff;
    --shadow:0 2px 0 rgba(38,48,43,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 31px, var(--paper-line) 32px),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    line-height:1.7;
    padding-bottom:80px;
  }
  .wrap{max-width:760px; margin:0 auto; padding:0 20px;}
  header.hero{
    padding:52px 20px 30px;
    max-width:760px; margin:0 auto;
    border-bottom:3px solid var(--ink);
  }
  .kicker{font-size:13px; letter-spacing:1px; color:var(--ink-soft); margin-bottom:8px;}
  h1.title{
    font-family:'Noto Serif TC', serif; font-weight:900; font-size:40px;
    margin:0 0 12px; line-height:1.25;
  }
  h1.title .mark{background:linear-gradient(transparent 60%, var(--yellow) 60%); padding:0 2px;}
  .subtitle{font-size:15px; color:var(--ink-soft); max-width:560px; margin:0;}

  main{max-width:760px; margin:0 auto; padding:32px 20px 0;}

  .yearGroup{margin-bottom:38px;}
  .yearGroup h2{
    font-family:'Noto Serif TC', serif; font-size:18px; font-weight:700;
    margin:0 0 14px; padding-bottom:8px; border-bottom:2px solid var(--ink);
  }
  .examGrid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:560px){.examGrid{grid-template-columns:1fr;}}

  .examCard{
    display:block; text-decoration:none; color:var(--ink);
    background:var(--card); border:2px solid var(--ink); border-radius:4px;
    padding:18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .examCard::before{
    content:""; position:absolute; top:0; left:0; width:6px; height:100%;
    background:var(--tagcolor, var(--coral));
  }
  .examCard .exam-session{font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
  .examCard .exam-title{font-family:'Noto Serif TC', serif; font-size:17px; font-weight:700; margin-bottom:8px;}
  .examCard .exam-desc{font-size:12.5px; color:var(--ink-soft);}
  .examCard .exam-go{font-size:12.5px; font-weight:700; color:var(--coral); margin-top:10px; display:inline-block;}

  .placeholder{
    border:2px dashed var(--paper-line); border-radius:4px; padding:22px;
    text-align:center; color:var(--ink-soft); font-size:13.5px;
  }

  footer.pagefoot{text-align:center; color:var(--ink-soft); font-size:12px; padding:50px 20px 10px;}
</style>
</head>
<body>

<header class="hero">
  <div class="kicker">技術士技能檢定・速記講義收藏庫</div>
  <h1 class="title">就服乙級<br><span class="mark">葵花寶典</span></h1>
  <p class="subtitle">每個梯次一份講義：重點整理＋模擬測驗＋術科數字卡，非本科系也背得起來。點進去哪一梯，就複習哪一梯。</p>
</header>

<main>

  <div class="yearGroup">
    <h2>115 年度</h2>
    <div class="examGrid">

      <a class="examCard" href="exams/115-1.html" style="--tagcolor:var(--coral)">
        <div class="exam-session">115 年・第 1 梯次</div>
        <div class="exam-title">19500 就業服務乙級</div>
        <div class="exam-desc">學科 80 題重點整理・術科十大題數字卡</div>
        <span class="exam-go">開始複習 →</span>
      </a>

        <a class="examCard" href="exams/115-2.html" style="--tagcolor:var(--coral)">
        <div class="exam-session">115 年・第 2 梯次</div>
        <div class="exam-title">19500 就業服務乙級</div>
        <div class="exam-desc">學科 80 題重點整理・術科十大題數字卡</div>
        <span class="exam-go">開始複習 →</span>
      </a>

    </div>
  </div>

  <div class="yearGroup">
    <h2>114 年度</h2>
    <div class="examGrid">
      <div class="placeholder">尚未加入任何梯次</div>
    </div>
  </div>

</main>

<footer class="pagefoot">每一梯次的內容僅供個人複習使用，正式答案仍以勞動部技能檢定中心公告為準。</footer>

<!--
  ============================================
  給「未來的我」和使用者的新增梯次說明：
  1. 新的一梯講義做成單一 HTML 檔，存到 exams/ 資料夾下，
     檔名建議用「民國年-梯次.html」，例如 114-3.html
  2. 回到這個 index.html，複製一整塊 <a class="examCard">...</a>
     貼到對應年度的 .examGrid 裡面，改掉：
       - href="exams/114-3.html"
       - exam-session 文字
       - exam-title / exam-desc 文字
     如果該年度還沒有 yearGroup，就整組 <div class="yearGroup">...</div> 複製一份新增。
  3. 有 .placeholder 的地方代表「還沒加入」，加入新梯次後可以刪掉對應的 placeholder。
  ============================================
-->

</body>
</html>
