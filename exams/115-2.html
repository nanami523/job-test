<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>115年第2梯次就業服務乙級・葵花寶典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8F1;
    --paper-line:#E7E1D2;
    --ink:#26302B;
    --ink-soft:#5B6459;
    --yellow:#FFCE45;
    --pink:#FF8FA3;
    --mint:#4FBE8E;
    --sky:#4FA6D8;
    --purple:#9B7FE0;
    --coral:#FF7A5C;
    --olive:#8C9A4E;
    --card:#ffffff;
    --shadow:0 2px 0 rgba(38,48,43,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 31px, var(--paper-line) 32px),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    line-height:1.7;
    padding-bottom:80px;
  }
  
  /* 置頂導覽列樣式 */
  .top-nav {
    background: var(--card);
    border-bottom: 2px solid var(--ink);
    padding: 12px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-nav .wrap-nav {
    max-width: 760px;
    margin: 0 auto;
  }
  .back-home {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    color: var(--ink);
    font-weight: 700;
    font-size: 14px;
    background: var(--paper);
    border: 2px solid var(--ink);
    padding: 6px 12px;
    border-radius: 4px;
    box-shadow: var(--shadow);
    transition: background 0.2s;
  }
  .back-home:hover {
    background: var(--yellow);
  }

  .wrap{max-width:760px; margin:0 auto; padding:0 20px;}
  header.hero{
    padding:40px 20px 30px;
    max-width:760px; margin:0 auto;
    border-bottom:3px solid var(--ink);
  }
  .kicker{font-size:13px; letter-spacing:1px; color:var(--ink-soft); margin-bottom:8px;}
  h1.title{
    font-family:'Noto Serif TC', serif; font-weight:900; font-size:36px;
    margin:0 0 12px; line-height:1.25;
  }
  h1.title .mark{background:linear-gradient(transparent 60%, var(--yellow) 60%); padding:0 2px;}
  .subtitle{font-size:15px; color:var(--ink-soft); max-width:560px; margin:0;}

  main{max-width:760px; margin:0 auto; padding:32px 20px 0;}
  
  /* 頁面主要內容區域可依您的 115-2 結構繼續往下擴充 */
  .content-section {
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }

  footer.pagefoot{text-align:center; color:var(--ink-soft); font-size:12px; padding:50px 20px 10px;}
</style>
</head>
<body>

<!-- 置頂導覽列 -->
<nav class="top-nav">
  <div class="wrap-nav">
    <a href="https://job-test-96bv.onrender.com/index.html" class="back-home">← 回葵花寶典目錄</a>
  </div>
</nav>

<header class="hero">
  <div class="kicker">115年度第2梯次・技術士技能檢定</div>
  <h1 class="title">19500 就業服務乙級<br><span class="mark">第二梯次學科與術科題解</span></h1>
  <p class="subtitle">包含學科模擬測驗（單選與複選）以及術科十大題完整解答與法源依據。</p>
</header>

<main>
  <div class="content-section">
    <h2>115年第2梯次 講義內容</h2>
    <p>（此處為您的 115-2 講義與測驗介面）</p>
  </div>
</main>

<footer class="pagefoot">每一梯次的內容僅供個人複習使用，正式答案仍以勞動部技能檢定中心公告為準。</footer>

</body>
</html>
