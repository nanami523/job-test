const topicsEl = document.getElementById('topics');
const catnavEl = document.getElementById('catnav');

topics.forEach(t=>{
  const a = document.createElement('a');
  a.className='chip'; a.href='#'+t.id; a.textContent=t.title.split('：')[0].split('／')[0];
  a.style.borderColor = t.color;
  catnavEl.appendChild(a);

  const div = document.createElement('div');
  div.className='topic'; div.id=t.id;

  let bodyHtml = `<ul>${t.points.map(p=>`<li>${p}</li>`).join('')}</ul>`;

  if(t.table){
    bodyHtml += `<table class="threshold"><thead><tr>${t.table.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
      t.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')
    }</tbody></table>`;
  }
  if(t.pointsAfterTable){
    bodyHtml += `<ul>${t.pointsAfterTable.map(p=>`<li>${p}</li>`).join('')}</ul>`;
  }
  if(t.sublist){
    bodyHtml += `<ul>${t.sublist.map(p=>`<li>${p}</li>`).join('')}</ul>`;
  }
  if(t.mnemonic){
    bodyHtml += `<div class="mnemonic">${t.mnemonic}</div>`;
  }

  div.innerHTML = `
    <div class="topic-head" style="background:${t.color}22">
      <span class="tag" style="background:${t.color}"></span>
      <h2>${t.title}</h2>
    </div>
    <div class="topic-body">${bodyHtml}</div>`;
  topicsEl.appendChild(div);
});
